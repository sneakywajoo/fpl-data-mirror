name: Sync FPL data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build snapshot directly from public FPL API
        run: python scripts/sync_fpl.py

      - name: Validate snapshot
        run: python -c "import json; d=json.load(open('snapshot/fpl.json')); assert d['ok']; print(d['generated_at'], d['query']['gw'], d['league_manager_count'])"

      - name: Commit snapshot if changed
        run: |
          git config user.name 'fpl-snapshot-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add snapshot/fpl.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update FPL snapshot'
            git push
          fi
